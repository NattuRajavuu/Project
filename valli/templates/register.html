{% extends "base.html" %}
{% block title %}Register - Luxe Atelier{% endblock %}
{% block content %}
<section class="section grid items-center gap-10 lg:grid-cols-[.9fr_1fr]">
  <div><p class="eyebrow">Join</p><h1 class="mt-4 text-5xl font-black tracking-[-.05em]">Create a quieter way to shop.</h1><p class="mt-5 max-w-lg leading-8 text-black/60 dark:text-white/60">Your demo account is stored in the secure Flask session for this Python app.</p></div>
  <form method="post" class="card grid gap-4">
    <h2 class="text-2xl font-black">Create account</h2>
    <input class="input" name="name" placeholder="Full name" required>
    <input class="input" name="email" type="email" placeholder="Email address" required>
    <input class="input" name="password" type="password" placeholder="Password" required>
    <button class="btn-primary">Register</button>
    <p class="text-center text-sm text-black/50 dark:text-white/50">Already a member? <a class="font-bold underline" href="{{ url_for('auth.login') }}">Login</a></p>
  </form>
</section>
{% endblock %}
