<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A premium minimalist ecommerce experience powered by Python static serving." />
    <title>Luxe Atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="loading" id="loading">
      <div>
        <div class="pulse"></div>
        <p>Luxe Atelier</p>
      </div>
    </div>

    <header class="navbar">
      <a class="brand" href="#home">Luxe Atelier</a>
      <nav class="nav-links">
        <a href="#home">Home</a>
        <a href="#products">Shop</a>
        <a href="#wishlist">Wishlist</a>
        <a href="#profile">Profile</a>
        <a href="#login">Login</a>
      </nav>
      <form class="search" id="navSearch">
        <span>⌕</span>
        <input id="searchInput" placeholder="Search essentials" aria-label="Search products" />
      </form>
      <div class="nav-actions">
        <button class="icon-button" id="themeToggle" aria-label="Toggle theme">◐</button>
        <a class="icon-button cart-link" href="#cart" aria-label="Cart">Bag <span id="cartCount">0</span></a>
        <button class="icon-button mobile-only" id="menuToggle" aria-label="Toggle menu">☰</button>
      </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
      <a href="#home">Home</a>
      <a href="#products">Shop</a>
      <a href="#wishlist">Wishlist</a>
      <a href="#profile">Profile</a>
      <a href="#login">Login</a>
    </div>

    <main id="app"></main>

    <footer class="footer">
      <div>
        <h2>Luxe Atelier</h2>
        <p>Curated objects for quieter work, richer travel, and better everyday rituals.</p>
      </div>
      <div>
        <h3>Explore</h3>
        <a href="#products">Products</a>
        <a href="#wishlist">Wishlist</a>
        <a href="#cart">Cart</a>
      </div>
      <div>
        <h3>Member Care</h3>
        <a href="#profile">Profile</a>
        <a href="#auth">Login</a>
        <a href="mailto:care@luxeatelier.test">care@luxeatelier.test</a>
      </div>
    </footer>

    <div class="toast" id="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
