{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="mx-auto max-w-md panel p-6">
    <h1 class="mb-6 text-3xl font-bold">Login</h1>
    <form method="post" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="field">Email<input name="email" type="email" required></label>
        <label class="field">Password<input name="password" type="password" required></label>
        <button class="primary-btn w-full" type="submit">Login</button>
    </form>
    <p class="mt-4 text-sm text-slate-400">New here? <a class="text-cyan-300" href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
